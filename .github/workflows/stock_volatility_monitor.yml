name: Stock Portfolio Volatility Cloud Monitor (3% / 6% / 8%)

on:
  schedule:
    # 台股開盤時段：週一至週五 台北時間 09:00 ~ 13:45 (對應 UTC 01:00 ~ 05:45) 每 15 分鐘執行一次
    - cron: '*/15 1-5 * * 1-5'
    # 美股開盤時段：週一至週五 美東時間 09:30 ~ 16:00 (對應 UTC 13:30 ~ 21:00) 每 15 分鐘執行一次
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_check:
        description: '是否忽略開盤時間強制檢查全部持股 (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  stock-volatility-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stock Volatility Check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.force_check }}" = "true" ]; then
            python stock_volatility_cloud.py --force
          else
            python stock_volatility_cloud.py
          fi

      - name: Commit updated stock_alert_state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_alert_state.json
          git diff --staged --quiet || (git pull --rebase origin main && git commit -m "chore: update stock_alert_state.json" && git push)
