name: Portfolio Earnings & Investor Conference Cloud Analyzer (Gemini 4 Argon)

on:
  schedule:
    # 每 4 小時自動巡邏一次（全天候覆蓋台股盤後法說會與美股盤後財報發布時段）
    # 優先連結 Gmail 檢查是否有新增持股標的，並比對既有持股是否發布最新一季財報或召開新法說會
    # 若無新增持股且無新季度財報/法說會，僅耗時數秒即結束，完全不消耗任何 Gemini Token！
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force_symbol:
        description: '強制指定分析特定持股代號（選填，例如：2330.TW、2454.TW、NVDA，或輸入 ALL 分析全部；留空則自動偵測新標的與新財報）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  earnings-and-call-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Portfolio Earnings & Investor Conference Cloud Analyzer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.force_symbol }}" ]; then
            python earnings_cloud_runner.py --force-symbol "${{ github.event.inputs.force_symbol }}"
          else
            python earnings_cloud_runner.py
          fi

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_monitor_state.json stock_alert_state.json
          git diff --staged --quiet || (git commit -m "chore: update earnings_monitor_state.json" && git pull --rebase origin main && git push)
